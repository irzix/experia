[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "experia"
version = "0.6.0"
description = "The open-source experience learning layer for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Experia AI Contributors", email = "hello@experia.ai" },
]
keywords = ["ai", "agent", "memory", "learning", "cognitive", "llm", "langchain", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.5", "ruff>=0.3.0", "aiosqlite>=0.20.0"]
llm = ["litellm>=1.0.0"]
langchain = ["langchain-core>=0.3"]
langgraph = ["langgraph"]
openai = ["openai"]

[tool.hatch.build.targets.wheel]
packages = ["experia"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"] # pycodestyle, pyflakes, isort
ignore = []

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
asyncio_mode = "auto"
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["experia"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
